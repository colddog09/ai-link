<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>취R업 | 전문직 AI 추천 공고 목록</title>
  <meta name="description" content="취R업 - 김건우님의 AI 역량 분석 결과를 바탕으로 최적의 의료·전문직 채용 공고를 추천합니다." />
  <link rel="icon" href="assets/favicon.png" />

  <link rel="stylesheet" href="assets/theme.css" />
  <script src="assets/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f0f5ff',
              100: '#e0ecff',
              600: '#1d4ed8',
              700: '#0f3b82',
              800: '#0c2f68',
              900: '#081f44',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for inline JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase 10 Compat SDK CDN -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <!-- Custom Styles -->
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * {
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @keyframes load-bar {
      from { width: 8%; }
      to { width: 100%; }
    }
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-gray-900 selection:bg-blue-100 selection:text-blue-900 min-h-screen flex flex-col">
  <div id="app-header"></div>
  <div id="root" class="flex-1"></div>
  <div id="app-footer"></div>

  <script src="assets/firebase-db.js"></script>
  <script src="assets/jobs-data.js"></script>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // Inline Icons
    const Icon = ({ name, className = "w-4 h-4" }) => {
      switch (name) {
        case 'home':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
          );
        case 'work':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
          );
        case 'domain':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
          );
        case 'psychology':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
            </svg>
          );
        case 'lock':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          );
        case 'logo-cross':
          return (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="4" />
              <path d="M12 8v8M8 12h8" />
            </svg>
          );
        case 'sparkles':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
            </svg>
          );
        case 'search':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          );
        case 'bell':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
          );
        case 'bar-chart':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
          );
        case 'bookmark':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
            </svg>
          );
        case 'bookmark-filled':
          return (
            <svg className={className} fill="currentColor" viewBox="0 0 24 24">
              <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
            </svg>
          );
        case 'rotate-ccw':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          );
        case 'sliders':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4" />
            </svg>
          );
        case 'chevron-down':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          );
        case 'chevron-up':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M5 15l7-7 7 7" />
            </svg>
          );
        case 'chevron-right':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          );
        case 'shield-check':
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
          );
        default:
          return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
              <circle cx="12" cy="12" r="10" />
            </svg>
          );
      }
    };

    // 공고 원본은 assets/jobs-data.js에 모아 두었다
    const JOB_LISTINGS = window.ChwireupCatalog || [];

    // Firestore 연결은 assets/firebase-db.js가 관리한다
    const db = (window.ChwireupDB && window.ChwireupDB.db()) || null;

    function CompanyListPage() {
      // 기업 회원이 직접 올린 공고를 앞에 붙인다
      const [jobsList, setJobsList] = useState(() => {
        const posted = (window.ChwireupJobs && window.ChwireupJobs.list()) || [];
        return [...posted, ...JOB_LISTINGS];
      });
      const [searchQuery, setSearchQuery] = useState('');
      const [sortBy, setSortBy] = useState('추천순');
      const [isFilterOpen, setIsFilterOpen] = useState(false);

      // 로그인한 사람 정보. 헤더가 쓰는 것과 같은 저장소를 읽는다.
      const authRole = (window.ChwireupAuth && window.ChwireupAuth.role()) || null;
      const isGuest = authRole !== 'personal' && authRole !== 'company';
      const displayName = (window.ChwireupAuth && window.ChwireupAuth.name()) || '김건우';

      // 목록에 들어올 때 분석 중이라는 사실을 먼저 보여준다
      const [isPreparing, setIsPreparing] = useState(true);
      const [showLoginPrompt, setShowLoginPrompt] = useState(false);
      const [savedJobIds, setSavedJobIds] = useState(['snuh-senior-medical-consultant', 'severance-checkup-director']);
      const [isReportModalOpen, setIsReportModalOpen] = useState(false);
      const [firestoreStatus, setFirestoreStatus] = useState('연동 확인 중...');

      // 가입할 때 고른 희망 지역이 있으면 그것을 기본 필터로 쓴다.
      // 가입 때 고른 값은 '서울 강남구 역삼동'처럼 깊을 수 있다.
      // 목록 필터는 시·도 단위라 첫 조각만 쓴다.
      const signupRegion = (() => {
        try {
          const v = localStorage.getItem('chwireup-region');
          if (!v || v === '전국') return null;
          return v.split(' ')[0] || null;
        } catch (e) {
          return null;
        }
      })();
      const [selectedLocations, setSelectedLocations] = useState(signupRegion ? [signupRegion] : []);
      const [salaryMin, setSalaryMin] = useState(0);

      const hasCustomFilter =
        selectedLocations.length > 0 || salaryMin > 0 || searchQuery.trim().length > 0;

      useEffect(() => {
        const t = setTimeout(() => {
          setIsPreparing(false);
          // 로딩이 끝난 뒤에 로그인 안내를 띄운다. 로딩 위에 겹치면 어수선하다.
          if (isGuest) setShowLoginPrompt(true);
        }, 1800);
        return () => clearTimeout(t);
      }, []);

      // Realtime Firestore listener
      useEffect(() => {
        if (!db) {
          setFirestoreStatus('로컬 모드');
          return;
        }

        setFirestoreStatus('실시간 연동됨');

        // Listen to jobs collection
        const unsubJobs = db.collection('jobs').onSnapshot((snapshot) => {
          if (!snapshot.empty) {
            const fetched = snapshot.docs.map(d => d.data());
            // Format to match company.html requirements if needed
            const formatted = fetched.map(j => ({
              id: j.id,
              companyName: j.companyName,
              title: j.title,
              matchRate: j.matchScore || j.matchRate || 90,
              isAiRecommended: j.isAiRecommended !== undefined ? j.isAiRecommended : true,
              tag: j.tag || (j.isAiRecommended ? 'AI 추천' : '채용중'),
              location: j.location,
              experience: j.experienceLevel || j.experience || '경력 10년↑',
              salaryRange: j.salaryKRW || j.salaryRange || '1.2억 ~ 1.5억',
              deadline: j.deadline || '마감 D-10',
              imageUrl: j.imageUrl,
              specialty: j.specialty || (j.aiInsight && j.aiInsight.summary) || '전문의 자문',
            }));
            // Firestore 문서로 목록을 통째로 갈아치우면 카탈로그와 로컬에
            // 저장한 공고가 사라진다. id 기준으로 합친다.
            setJobsList((prev) => {
              const merged = [...formatted];
              const seen = new Set(formatted.map((j) => j.id));
              prev.forEach((j) => {
                if (!seen.has(j.id)) merged.push(j);
              });
              return merged;
            });
          }
        }, (err) => console.warn("Jobs snap in company.html:", err));

        // Listen to user saved jobs
        const unsubUser = db.collection('users').doc('user_kim_gunwoo').onSnapshot((doc) => {
          if (doc.exists && doc.data().savedJobIds) {
            setSavedJobIds(doc.data().savedJobIds);
          }
        }, (err) => console.warn("User snap in company.html:", err));

        return () => {
          unsubJobs();
          unsubUser();
        };
      }, []);

      const toggleLocation = (loc) => {
        if (loc === '서울 전체') {
          if (selectedLocations.includes('서울 전체')) {
            setSelectedLocations([]);
          } else {
            setSelectedLocations(['서울 전체', '서울 강남구', '서울 종로구', '서울 중구']);
          }
          return;
        }
        setSelectedLocations((prev) =>
          prev.includes(loc) ? prev.filter((item) => item !== loc) : [...prev, loc]
        );
      };

      const handleResetFilter = () => {
        setSelectedLocations([]);
        setSalaryMin(0);
        setSearchQuery('');
      };

      const toggleBookmark = async (jobId, e) => {
        e.stopPropagation();
        const alreadySaved = savedJobIds.includes(jobId);
        const newSaved = alreadySaved
          ? savedJobIds.filter((id) => id !== jobId)
          : [...savedJobIds, jobId];
        setSavedJobIds(newSaved);

        if (db) {
          try {
            await db.collection('users').doc('user_kim_gunwoo').set({
              savedJobIds: newSaved,
              updatedAt: new Date().toISOString()
            }, { merge: true });
          } catch (err) {
            console.error("Error saving bookmark to Firestore:", err);
          }
        }
      };

      const navigateToDetail = (jobId) => {
        window.location.href = `detail.html?jobId=${jobId}`;
      };

      // '1.2억 ~ 1.5억', '8,000만 ~ 1억', '1.4억 + 스톡옵션' 같은 표기에서
      // 하한 금액을 만원 단위 숫자로 뽑아낸다. 정렬과 연봉 필터가 함께 쓴다.
      const parseSalaryFloor = (range) => {
        if (!range) return 0;
        const eok = range.match(/([\d.]+)\s*억/);
        if (eok) return Math.round(parseFloat(eok[1]) * 10000);
        const man = range.replace(/,/g, '').match(/(\d+)\s*만/);
        if (man) return parseInt(man[1], 10);
        return 0;
      };

      // 마감 D-n이 작을수록 최근 공고로 본다. 상시 채용은 뒤로 보낸다.
      const deadlineWeight = (deadline) => {
        const m = (deadline || '').match(/D-(\d+)/);
        return m ? parseInt(m[1], 10) : 999;
      };

      const filteredJobs = useMemo(() => {
        return jobsList.filter((job) => {
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matches =
              job.title.toLowerCase().includes(q) ||
              job.companyName.toLowerCase().includes(q) ||
              job.location.toLowerCase().includes(q) ||
              (job.specialty && job.specialty.toLowerCase().includes(q));
            if (!matches) return false;
          }

          if (selectedLocations.length > 0) {
            // 광역 단위로 본다. 충청, 전라, 경상은 남북도를 함께 묶는다.
            const REGION_ALIASES = {
              충청: ['충청', '충남', '충북', '대전', '세종', '천안', '청주'],
              전라: ['전라', '전남', '전북', '광주', '전주', '여수'],
              경상: ['경상', '경남', '경북', '대구', '부산', '울산', '포항', '창원'],
              경기: ['경기', '판교', '성남', '수원', '화성', '용인', '고양'],
            };
            const hit = selectedLocations.some((loc) => {
              const keys = REGION_ALIASES[loc] || [loc];
              return keys.some((k) => job.location.includes(k));
            });
            if (!hit) return false;
          }

          if (salaryMin > 0 && parseSalaryFloor(job.salaryRange) < salaryMin) return false;

          return true;
        });
      }, [jobsList, searchQuery, selectedLocations, salaryMin]);

      // 정렬은 필터를 통과한 목록 위에서 수행한다.
      const sortedJobs = useMemo(() => {
        const list = filteredJobs.slice();
        switch (sortBy) {
          case '매칭률순':
            return list.sort((a, b) => b.matchRate - a.matchRate);
          case '연봉순':
            return list.sort((a, b) => parseSalaryFloor(b.salaryRange) - parseSalaryFloor(a.salaryRange));
          case '최신순':
            return list.sort((a, b) => {
              const at = a.createdAt ? Date.parse(a.createdAt) : 0;
              const bt = b.createdAt ? Date.parse(b.createdAt) : 0;
              if (at || bt) return bt - at;
              return deadlineWeight(a.deadline) - deadlineWeight(b.deadline);
            });
          default:
            // 추천순: AI 추천 공고를 먼저, 그 안에서 매칭률 높은 순
            return list.sort((a, b) => {
              if (!!b.isAiRecommended !== !!a.isAiRecommended) {
                return b.isAiRecommended ? 1 : -1;
              }
              return b.matchRate - a.matchRate;
            });
        }
      }, [filteredJobs, sortBy]);

      return (
        <div className="min-h-screen flex flex-col bg-[#f8fafc]">
          {/* ========================================== */}
          {/* 1. TOP GLOBAL NAVBAR                       */}
          {/* ========================================== */}

          {/* ========================================== */}
          {/* 진입 로딩: 무엇을 하고 있는지 먼저 알린다   */}
          {/* ========================================== */}
          {isPreparing && (
            <div className="fixed inset-0 z-[60] bg-[#f8fafc] flex flex-col items-center justify-center px-6">
              <div className="relative w-24 h-24 mb-7 flex items-center justify-center">
                <span className="absolute inset-0 rounded-full border-2 border-blue-200 animate-ping"></span>
                <span className="absolute inset-3 rounded-full border-2 border-blue-100"></span>
                <span className="relative w-14 h-14 rounded-2xl bg-[#002045] text-white flex items-center justify-center">
                  <Icon name="sparkles" className="w-6 h-6" />
                </span>
              </div>

              <p className="text-base sm:text-lg font-extrabold text-gray-900 text-center leading-relaxed">
                {isGuest
                  ? '검증된 공고를 불러오고 있습니다'
                  : `${displayName}님의 역량 분석 결과를 바탕으로 추천하고 있습니다`}
              </p>
              <p className="text-xs text-gray-500 mt-2 text-center">
                자동화 위험이 낮고 재무·근속이 확인된 공고만 골라내는 중입니다
              </p>

              <div className="w-56 h-1 bg-gray-200 rounded-full overflow-hidden mt-7">
                <div className="h-full bg-[#002045] rounded-full" style={{ animation: 'load-bar 1.8s ease-out forwards' }}></div>
              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* 로그인 안내                                */}
          {/* ========================================== */}
          {showLoginPrompt && (
            <div className="fixed inset-0 z-[59] bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-7 text-center shadow-2xl">
                <div className="w-12 h-12 rounded-2xl bg-blue-50 text-blue-700 flex items-center justify-center mx-auto mb-4">
                  <Icon name="lock" className="w-5 h-5" />
                </div>
                <h3 className="text-lg font-black text-gray-900 mb-2">로그인하고 맞춤 추천 받기</h3>
                <p className="text-xs text-gray-600 leading-relaxed mb-6">
                  로그인하면 경력과 희망 조건에 맞춰 순서를 다시 매기고,
                  직무별 자동화 위험도와 매칭률까지 함께 보여드립니다.
                </p>

                <div className="space-y-2.5">
                  <a
                    href="ls.html"
                    className="block w-full py-3.5 bg-[#002045] text-white rounded-2xl text-sm font-bold hover:opacity-90 transition"
                  >
                    로그인 / 회원가입
                  </a>
                  <button
                    onClick={() => setShowLoginPrompt(false)}
                    className="block w-full py-3 text-xs font-bold text-gray-500 hover:text-gray-800 transition"
                  >
                    로그인 없이 둘러보기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* 2. SUBHEADER: AI RECOMMENDATION BANNER     */}
          {/* ========================================== */}
          <div className="bg-white border-b border-gray-200 py-6">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <h1 className="text-xl sm:text-2xl font-black text-gray-900 tracking-tight">
                    {isGuest
                      ? '사람 몫으로 남은 자리'
                      : `${displayName}님의 역량 분석 결과를 바탕으로 추천합니다`}
                  </h1>
                  <p className="text-xs sm:text-sm text-gray-500 mt-1 font-medium">
                    {isGuest
                      ? '자동화로 먼저 사라질 직무는 걸러 냈습니다. 로그인하면 경력에 맞춰 순서를 다시 매겨 드립니다'
                      : '내과·흉부외과 전문의 15년. 사람이 최종 판단을 맡는 직무 위주로 추립니다'}
                  </p>
                </div>

                <button
                  onClick={() => setIsReportModalOpen(true)}
                  className="inline-flex items-center gap-2 px-4 py-2.5 bg-white border border-gray-300 hover:border-blue-600 rounded-xl text-xs sm:text-sm font-bold text-gray-800 hover:text-blue-700 shadow-xs transition-all flex-shrink-0"
                >
                  <Icon name="bar-chart" className="w-4 h-4 text-blue-600" />
                  <span>분석 결과 다시 보기</span>
                </button>
              </div>
            </div>
          </div>

          {/* ========================================== */}
          {/* 3. MAIN CONTENT: SIDEBAR + 3-COLUMN CARDS  */}
          {/* ========================================== */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
            <section className="space-y-5">
              {/* 결과 수 · 정렬 · 직접 설정 */}
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="flex items-center gap-2">
                  <span className="text-base font-extrabold text-gray-900">
                    총 {sortedJobs.length}건
                  </span>
                  {hasCustomFilter && (
                    <button
                      onClick={handleResetFilter}
                      className="text-[11px] font-bold text-blue-700 hover:underline"
                    >
                      필터 해제
                    </button>
                  )}
                </div>

                <div className="flex items-center gap-2">
                  {/* 필터는 기본으로 접어 두고, 필요할 때만 연다 */}
                  <button
                    onClick={() => setIsFilterOpen(true)}
                    className="inline-flex items-center gap-1.5 border border-gray-300 hover:border-blue-600 bg-white rounded-xl px-3 py-2 text-[11px] font-bold text-gray-700 hover:text-blue-700 transition"
                  >
                    <Icon name="sliders" className="w-3.5 h-3.5" />
                    <span>직접 설정</span>
                    {hasCustomFilter && (
                      <span className="w-1.5 h-1.5 rounded-full bg-blue-600"></span>
                    )}
                  </button>

                  <div className="relative">
                    <select
                      value={sortBy}
                      onChange={(e) => setSortBy(e.target.value)}
                      className="appearance-none bg-white border border-gray-300 rounded-xl px-3.5 py-2 pr-8 text-xs font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-600 cursor-pointer"
                    >
                      <option value="추천순">추천순</option>
                      {!isGuest && <option value="매칭률순">매칭률순</option>}
                      <option value="연봉순">연봉순</option>
                      <option value="최신순">최신 등록순</option>
                    </select>
                    <div className="absolute inset-y-0 right-0 flex items-center pr-2.5 pointer-events-none text-gray-500">
                      <Icon name="chevron-down" className="w-3.5 h-3.5" />
                    </div>
                  </div>
                </div>
              </div>


                {/* 3-Column Cards Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                  {sortedJobs.map((job) => {
                    const isSaved = savedJobIds.includes(job.id);
                    return (
                      <div
                        key={job.id}
                        onClick={() => navigateToDetail(job.id)}
                        className="bg-white rounded-2xl border border-gray-200 shadow-xs hover:shadow-md hover:border-blue-300 transition-all cursor-pointer flex flex-col overflow-hidden group"
                      >
                        {/* Top Image Banner with Matching & Bookmark */}
                        <div className="relative h-44 w-full overflow-hidden bg-gray-100">
                          <img
                            src={job.imageUrl}
                            alt={job.title}
                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-transparent"></div>

                          {/* 매칭률은 로그인해서 역량 정보를 준 사람에게만 의미가 있다 */}
                          {isGuest ? (
                            <div className="absolute top-3 left-3 bg-white/95 backdrop-blur-xs px-2.5 py-1.5 rounded-xl shadow-md border border-white/40 flex items-center gap-1">
                              <Icon name="lock" className="w-3 h-3 text-gray-500" />
                              <span className="text-[10px] font-bold text-gray-600 leading-none">
                                로그인 후 매칭률 확인
                              </span>
                            </div>
                          ) : (
                            <div className="absolute top-3 left-3 bg-white/95 backdrop-blur-xs px-2.5 py-1.5 rounded-xl shadow-md border border-white/40 flex flex-col items-center">
                              <span className="text-xs font-black text-blue-700 leading-none">
                                {job.matchRate}%
                              </span>
                              <span className="text-[9px] font-bold text-gray-500 mt-0.5 leading-none">
                                매칭률
                              </span>
                            </div>
                          )}

                          {/* Bookmark Button */}
                          <button
                            onClick={(e) => toggleBookmark(job.id, e)}
                            className="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/90 backdrop-blur-xs flex items-center justify-center text-gray-700 hover:text-blue-700 shadow-md transition-colors"
                          >
                            {isSaved ? (
                              <Icon name="bookmark-filled" className="w-4 h-4 text-blue-700" />
                            ) : (
                              <Icon name="bookmark" className="w-4 h-4" />
                            )}
                          </button>
                        </div>

                        {/* Card Body */}
                        <div className="p-5 flex-1 flex flex-col justify-between space-y-4">
                          <div>
                            {/* Tag */}
                            <div className="mb-2">
                              {job.isAiRecommended ? (
                                <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-blue-50 text-blue-700 border border-blue-100">
                                  <Icon name="sparkles" className="w-3 h-3 text-blue-600" />
                                  AI 추천
                                </span>
                              ) : (
                                <span className="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold bg-purple-50 text-purple-700 border border-purple-100">
                                  채용중
                                </span>
                              )}
                            </div>

                            {/* Job Title */}
                            <h3 className="text-base font-extrabold text-gray-900 group-hover:text-blue-700 transition-colors line-clamp-2">
                              {job.title}
                            </h3>

                            {/* Company Name */}
                            <p className="text-xs font-semibold text-gray-500 mt-1">
                              {job.companyName}
                            </p>

                            {/* Location & Experience Badges */}
                            <div className="flex flex-wrap gap-1.5 mt-3">
                              <span className="px-2 py-1 bg-gray-100 text-gray-700 rounded-md text-[11px] font-medium">
                                {job.location}
                              </span>
                              <span className="px-2 py-1 bg-gray-100 text-gray-700 rounded-md text-[11px] font-medium">
                                {job.experience}
                              </span>
                            </div>
                          </div>

                          {/* Card Footer: Salary & Deadline */}
                          <div className="pt-3 border-t border-gray-100 flex items-center justify-between text-xs">
                            <div>
                              <span className="text-[10px] text-gray-400 block font-medium">예상 연봉</span>
                              <span className="font-extrabold text-gray-900">{job.salaryRange}</span>
                            </div>
                            <span className="text-[11px] font-bold text-gray-500">
                              {job.deadline}
                            </span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                  {sortedJobs.length === 0 && (
                    <div className="col-span-full bg-white border border-gray-200 rounded-2xl p-10 text-center">
                      <p className="text-sm font-bold text-gray-900 mb-1">조건에 맞는 공고가 없습니다</p>
                      <p className="text-xs text-gray-500 mb-4">지역이나 연봉 조건을 넓혀 보세요.</p>
                      <button
                        onClick={handleResetFilter}
                        className="px-4 py-2 bg-[#002045] text-white rounded-xl text-xs font-bold"
                      >
                        필터 초기화
                      </button>
                    </div>
                  )}
                </div>
            </section>
          </main>

          {/* ========================================== */}
          {/* 필터 직접 설정 모달                        */}
          {/* ========================================== */}
          {isFilterOpen && (
            <div
              className="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4"
              onClick={() => setIsFilterOpen(false)}
            >
              <div
                className="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 space-y-6 shadow-2xl"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-black text-gray-900">필터 직접 설정</h3>
                  <button
                    onClick={() => setIsFilterOpen(false)}
                    className="text-gray-400 hover:text-gray-700 text-xl leading-none"
                  >
                    ✕
                  </button>
                </div>

                {/* 지역 */}
                <div>
                  <p className="text-xs font-bold text-gray-800 mb-3">지역</p>
                  <div className="grid grid-cols-3 gap-2.5 text-xs">
                    {['서울', '경기', '인천', '부산', '대구', '대전', '광주', '울산', '세종', '강원', '충청', '전라', '경상', '제주'].map((loc) => {
                      const isChecked = selectedLocations.includes(loc);
                      return (
                        <label key={loc} className="flex items-center gap-2.5 cursor-pointer select-none">
                          <input
                            type="checkbox"
                            checked={isChecked}
                            onChange={() => toggleLocation(loc)}
                            className="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
                          />
                          <span className={isChecked ? 'font-bold text-gray-900' : 'text-gray-600'}>{loc}</span>
                        </label>
                      );
                    })}
                  </div>
                </div>

                {/* 희망 연봉 */}
                <div>
                  <div className="flex justify-between text-xs font-bold text-gray-900 mb-3">
                    <span>희망 연봉</span>
                    <span className="text-blue-700">
                      {salaryMin === 0 ? '전체' : `${(salaryMin / 10000).toFixed(1)}억원 이상`}
                    </span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="20000"
                    step="1000"
                    value={salaryMin}
                    onChange={(e) => setSalaryMin(Number(e.target.value))}
                    className="w-full accent-blue-600 cursor-pointer"
                  />
                  <div className="flex justify-between text-[10px] text-gray-400 font-semibold mt-1">
                    <span>0원</span>
                    <span>1억원</span>
                    <span>2억원+</span>
                  </div>
                </div>

                {/* 검색어 */}
                <div>
                  <p className="text-xs font-bold text-gray-800 mb-2">검색어</p>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="직무, 기업명, 전문 분야"
                    className="w-full border border-gray-300 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-600"
                  />
                </div>

                <div className="flex gap-2.5 pt-1">
                  <button
                    onClick={handleResetFilter}
                    className="px-4 py-3 bg-gray-100 text-gray-700 rounded-xl text-xs font-bold"
                  >
                    초기화
                  </button>
                  <button
                    onClick={() => setIsFilterOpen(false)}
                    className="flex-1 py-3 bg-[#002045] text-white rounded-xl text-xs font-bold"
                  >
                    {sortedJobs.length}건 보기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* 4. AI REPORT MODAL (분석 결과 다시 보기)   */}
          {/* ========================================== */}
          {isReportModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl space-y-6">
                <div className="flex items-center justify-between border-b border-gray-100 pb-4">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-full bg-blue-50 text-blue-700 flex items-center justify-center">
                      <Icon name="sparkles" className="w-4 h-4" />
                    </div>
                    <h3 className="text-lg font-black text-gray-900">김건우 원장 AI 역량 진단 리포트</h3>
                  </div>
                  <button onClick={() => setIsReportModalOpen(false)} className="text-gray-400 hover:text-gray-600">✕</button>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="bg-blue-50 p-4 rounded-2xl border border-blue-100 text-blue-900">
                    <p className="font-bold text-sm mb-1">상위 5% 최우수 역량 매칭</p>
                    <p className="text-xs text-blue-800 leading-relaxed">
                      15년의 흉부외과 수술 및 병원 행정 자문 경험을 바탕으로 <strong>상급종합병원 시니어 컨설턴트</strong> 및 <strong>디지털 헬스케어 임상 디렉터</strong>에 가장 높은 적합도를 기록했습니다.
                    </p>
                  </div>

                  <div className="space-y-2.5">
                    <div className="flex justify-between font-bold">
                      <span>임상 전문성 및 프로토콜 감수</span>
                      <span className="text-blue-700">96점 (최상위)</span>
                    </div>
                    <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                      <div className="bg-blue-700 h-full w-[96%]"></div>
                    </div>

                    <div className="flex justify-between font-bold pt-2">
                      <span>병원 행정 및 정책 기획력</span>
                      <span className="text-blue-700">92점</span>
                    </div>
                    <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                      <div className="bg-blue-700 h-full w-[92%]"></div>
                    </div>

                    <div className="flex justify-between font-bold pt-2">
                      <span>조직 리더십 & 멘토링</span>
                      <span className="text-blue-700">88점</span>
                    </div>
                    <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                      <div className="bg-blue-700 h-full w-[88%]"></div>
                    </div>
                  </div>
                </div>

                <div className="pt-2 flex gap-3">
                  <a
                    href="detail.html?tab=ai-analysis"
                    className="flex-1 py-3 bg-blue-700 hover:bg-blue-800 text-white rounded-xl text-center font-bold text-xs shadow-xs"
                  >
                    정밀 분석 페이지로 이동
                  </a>
                  <button
                    onClick={() => setIsReportModalOpen(false)}
                    className="px-5 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold text-xs"
                  >
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* 5. FOOTER                                  */}
        </div>
      );
    }

    ReactDOM.render(<CompanyListPage />, document.getElementById('root'));
  </script>

  <script src="assets/chrome.js"></script>
  <script src="assets/auth-store.js"></script>
  <script src="assets/jobs-store.js"></script>
  <script src="assets/i18n.js"></script>
</body>
</html>
