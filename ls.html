<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>취R업 | 로그인 · 회원가입</title>
  <meta name="description" content="취R업 로그인. 개인 회원은 역량 진단과 지원 현황을, 기업 회원은 공고 등록과 지원자 관리를 이용합니다." />
  <link rel="icon" href="assets/favicon.png" />

  <link rel="stylesheet" href="assets/theme.css" />
  <script src="assets/theme.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Firebase (Auth + Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --ink: #0a1f3d;
      --mint: #17a894;
      --mint-lit: #2fc7b4;
      --paper: #eef2f8;
      --card: #ffffff;
      --rule: #c9d6e5;
      --muted: #4a5d7a;
    }
    html.dark {
      --ink: #dce6f7;
      --mint: #3ad8c2;
      --mint-lit: #5ff0d8;
      --paper: #070d18;
      --card: #0f1a2e;
      --rule: #22304a;
      --muted: #8496b3;
    }

    * { font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', monospace; font-feature-settings: 'tnum' 1; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; }

    body { background: var(--paper); color: var(--ink); }

    /* ── 좌측 무대: 이직 곡선이 흐르는 남색 판 ────────────────── */
    .stage {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(120% 90% at 12% 8%, #123a6e 0%, transparent 60%),
        radial-gradient(90% 80% at 88% 82%, #0d5f5c 0%, transparent 62%),
        linear-gradient(150deg, #071a34 0%, #0a2a4d 42%, #061426 100%);
      background-color: #071a34;
    }
    .stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.18) 1px, transparent 1px);
      background-size: 26px 26px;
      opacity: 0.25;
    }
    .stage-inner { position: relative; z-index: 2; }

    /* 화면을 가로지르는 곡선 – 홈에서 쓰는 것과 같은 제스처 */
    .stage-curve {
      position: absolute;
      left: 0; right: 0; bottom: 8%;
      z-index: 1;
      opacity: 0.85;
    }
    .stage-curve path {
      fill: none;
      stroke: var(--mint-lit);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 1400;
      stroke-dashoffset: 1400;
      animation: draw 2.4s cubic-bezier(0.65,0,0.35,1) 0.3s forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* 카운터처럼 올라오는 문구 */
    .rise { opacity: 0; transform: translateY(16px); animation: rise .8s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .08s } .d2 { animation-delay: .18s } .d3 { animation-delay: .28s }
    .d4 { animation-delay: .38s } .d5 { animation-delay: .48s }
    @keyframes rise { to { opacity: 1; transform: none; } }

    /* ── 역할 선택 카드 ─────────────────────────────────────── */
    .role {
      position: relative;
      border: 1.5px solid var(--rule);
      background: var(--card);
      border-radius: 20px;
      padding: 16px 18px;
      text-align: left;
      transition: border-color .25s ease, transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s ease;
      overflow: hidden;
    }
    .role:hover { transform: translateY(-2px); }
    .role[data-on="true"] {
      border-color: var(--mint);
      box-shadow: 0 0 0 4px rgba(23,168,148,0.12);
    }
    .role[data-on="true"] .role-check { opacity: 1; transform: scale(1); }
    .role-check {
      position: absolute; top: 12px; right: 12px;
      width: 20px; height: 20px; border-radius: 999px;
      background: var(--mint); color: #fff;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(.5);
      transition: opacity .2s ease, transform .25s cubic-bezier(.34,1.56,.64,1);
    }

    /* 입력창: 라벨이 위로 떠오른다 */
    .field { position: relative; }
    .field input {
      width: 100%;
      padding: 22px 16px 10px;
      border-radius: 16px;
      border: 1.5px solid var(--rule);
      background: var(--card);
      color: var(--ink);
      font-size: 14.5px;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .field input:focus {
      outline: none;
      border-color: var(--mint);
      box-shadow: 0 0 0 4px rgba(23,168,148,0.12);
    }
    .field label {
      position: absolute;
      left: 16px; top: 16px;
      font-size: 14px;
      color: var(--muted);
      pointer-events: none;
      transition: transform .18s cubic-bezier(.22,1,.36,1), font-size .18s, color .18s;
      transform-origin: left top;
    }
    .field input:focus + label,
    .field input:not(:placeholder-shown) + label {
      transform: translateY(-9px) scale(.78);
      color: var(--mint);
      font-weight: 700;
    }

    /* 제출 버튼 */
    .cta {
      position: relative;
      width: 100%;
      height: 54px;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-weight: 800;
      font-size: 14.5px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform .18s ease, opacity .2s ease;
      overflow: hidden;
    }
    html.dark .cta { background: #1c3a6e; }
    .cta:hover { transform: translateY(-1px); }
    .cta:active { transform: scale(.985); }
    .cta[disabled] { opacity: .6; pointer-events: none; }
    .cta .spin {
      width: 16px; height: 16px; border-radius: 999px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      animation: spin .7s linear infinite;
      display: none;
    }
    .cta[data-busy="true"] .spin { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .rsel {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      border-radius: 16px;
      border: 1.5px solid var(--rule);
      background: var(--card);
      color: var(--ink);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .rsel:focus {
      outline: none;
      border-color: var(--mint);
      box-shadow: 0 0 0 4px rgba(23,168,148,0.12);
    }

    .switch-tab {
      position: relative;
      padding: 10px 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      transition: color .2s ease;
    }
    .switch-tab[data-on="true"] { color: var(--ink); }
    .switch-underline {
      position: absolute; bottom: 0; height: 2px;
      background: var(--mint);
      border-radius: 999px;
      transition: transform .32s cubic-bezier(.22,1,.36,1), width .32s cubic-bezier(.22,1,.36,1);
    }

    @media (prefers-reduced-motion: reduce) {
      .rise, .stage-curve path { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <div id="app-header"></div>

  <main class="flex-1 grid lg:grid-cols-[1.05fr_1fr]">

    <!-- 좌: 무대 -->
    <section class="stage hidden lg:flex items-center px-14 xl:px-20 py-16">
      <svg class="stage-curve" viewBox="0 0 600 200" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 160 C 90 158, 180 164, 260 158 C 330 152, 390 120, 450 84 C 510 48, 560 28, 600 18" />
      </svg>

      <div class="stage-inner max-w-[30rem]">
        <p class="mono text-[12px] tracking-[0.18em] text-white/55 mb-7 rise d1">CHEER UP YOUR CAREER</p>

        <h1 class="text-white font-extrabold leading-[1.35] mb-6 rise d2"
            style="font-size: clamp(1.9rem, 2.6vw, 2.6rem); letter-spacing: -0.02em; word-break: keep-all;">
          AI가 가져간 자리 말고<br />
          <span style="color: var(--mint-lit)">사람에게 남은 자리를 찾습니다.</span>
        </h1>

        <p class="text-white/70 text-[15px] leading-[1.9] mb-12 rise d3" style="word-break: keep-all;">
          계정 하나면 역량 진단, 자동화 위험을 걸러 낸 공고, 담당자와의 안심 대화가 한 줄로 이어집니다.
          기업 회원은 같은 자리에서 공고를 올리고 지원 현황을 봅니다.
        </p>

        <div class="grid grid-cols-3 gap-6 pt-9 rise d4" style="border-top: 1px solid rgba(255,255,255,0.14)">
          <div>
            <p class="mono text-[24px] text-white leading-none mb-2">7</p>
            <p class="text-[12px] text-white/55">사람 몫 공고</p>
          </div>
          <div>
            <p class="mono text-[24px] leading-none mb-2" style="color: var(--mint-lit)">2.4일</p>
            <p class="text-[12px] text-white/55">평균 매칭 기간</p>
          </div>
          <div>
            <p class="mono text-[24px] text-white leading-none mb-2">0507</p>
            <p class="text-[12px] text-white/55">안심번호 연결</p>
          </div>
        </div>

        <figure class="mt-12 rise d5">
          <blockquote class="text-white/80 text-[14px] leading-[1.9]" style="word-break: keep-all;">
            “딸 하나 둔 의사 아빠입니다. 근속 연수와 고용안정등급을 숫자로 보여주니 고를 수가 있었어요.”
          </blockquote>
          <figcaption class="mt-3 text-[12.5px] text-white/50">김건우 · 45세 · 내과 전문의</figcaption>
        </figure>
      </div>
    </section>

    <!-- 우: 폼 -->
    <section class="flex items-center justify-center px-5 sm:px-10 py-12">
      <div class="w-full max-w-[26rem]">

        <div class="mb-7">
          <h2 id="form-title" class="text-[26px] font-extrabold mb-2" style="letter-spacing:-0.02em">다시 오셨네요</h2>
          <p id="form-desc" class="text-[13.5px]" style="color: var(--muted)">개인 회원으로 로그인합니다</p>
        </div>

        <!-- 역할 -->
        <div class="grid grid-cols-2 gap-3 mb-6">
          <button type="button" class="role" data-role="personal" data-on="true">
            <span class="role-check"><span class="material-symbols-outlined" style="font-size:13px">check</span></span>
            <span class="material-symbols-outlined block mb-2" style="font-size:20px; color: var(--mint)">person</span>
            <span class="block text-[14px] font-bold">개인 회원</span>
            <span class="block text-[11.5px] mt-0.5" style="color: var(--muted)">역량 진단, 지원 관리</span>
          </button>
          <button type="button" class="role" data-role="company" data-on="false">
            <span class="role-check"><span class="material-symbols-outlined" style="font-size:13px">check</span></span>
            <span class="material-symbols-outlined block mb-2" style="font-size:20px; color: var(--mint)">domain</span>
            <span class="block text-[14px] font-bold">기업 회원</span>
            <span class="block text-[11.5px] mt-0.5" style="color: var(--muted)">공고 등록, 지원자 확인</span>
          </button>
        </div>

        <!-- 로그인 / 회원가입 -->
        <div class="relative flex gap-6 mb-6" style="border-bottom: 1px solid var(--rule)">
          <button type="button" id="tab-login" class="switch-tab" data-on="true">로그인</button>
          <button type="button" id="tab-signup" class="switch-tab" data-on="false">회원가입</button>
          <span id="tab-underline" class="switch-underline" style="width: 52px; transform: translateX(0)"></span>
        </div>

        <div id="alert" class="hidden mb-4 p-3.5 rounded-2xl text-[12.5px] leading-relaxed"></div>

        <form id="auth-form" class="space-y-3">
          <!-- 로그인은 영문 아이디로 한다 -->
          <div class="field">
            <input id="userid" type="text" placeholder=" " required autocomplete="username"
                   pattern="[A-Za-z0-9._\-]{4,20}" value="drkim" />
            <label for="userid">아이디 (영문·숫자)</label>
          </div>

          <!-- 이름은 가입할 때만 받는다. 화면에 표시되는 이름이다. -->
          <div id="field-name" class="field hidden">
            <input id="name" type="text" placeholder=" " autocomplete="name" value="김건우" />
            <label for="name" id="label-name">이름</label>
          </div>

          <div class="field">
            <input id="password" type="password" placeholder=" " required minlength="6" autocomplete="current-password" value="drkim1234" />
            <label for="password">비밀번호</label>
          </div>

          <div id="field-confirm" class="field hidden">
            <input id="confirm" type="password" placeholder=" " minlength="6" autocomplete="new-password" />
            <label for="confirm">비밀번호 확인</label>
          </div>

          <div id="field-extra" class="field hidden">
            <input id="extra" type="text" placeholder=" " />
            <label for="extra" id="label-extra">전문 분야 / 면허</label>
          </div>

          <!-- 지역: 시·도를 고르면 시·군·구 목록이 따라 바뀐다 -->
          <div id="field-region" class="hidden">
            <label class="block text-[12px] font-bold mb-2" id="label-region"
                   style="color: var(--muted)">희망 근무 지역</label>
            <div class="grid grid-cols-2 gap-2.5">
              <select id="region-sido" class="rsel"></select>
              <select id="region-sigungu" class="rsel"></select>
            </div>
            <p class="text-[11.5px] mt-2" id="region-note" style="color: var(--muted)">
              고른 지역이 채용공고 기본 필터로 들어갑니다. 나중에 바꿀 수 있습니다.
            </p>
          </div>

          <button id="cta" type="submit" class="cta mt-2">
            <span class="spin"></span>
            <span id="cta-text">로그인</span>
            <span class="material-symbols-outlined" style="font-size:18px">arrow_forward</span>
          </button>
        </form>

        <div class="mt-5 flex items-center justify-between gap-3 text-[12px]" style="color: var(--muted)">
          <span id="storage-note" class="inline-flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full" style="background: var(--mint)"></span>
            <span id="storage-text">계정 저장소 확인 중</span>
          </span>
          <button id="fill-demo" type="button" class="font-bold hover:underline" style="color: var(--ink)">체험 계정 채우기</button>
        </div>

        <p class="mt-7 text-center text-[13px]" style="color: var(--muted)">
          <span id="switch-text">계정이 없으신가요?</span>
          <button id="switch-link" type="button" class="font-bold ml-1 hover:underline" style="color: var(--ink)">회원가입</button>
        </p>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="assets/firebase-config.js"></script>
  <script src="assets/firebase-db.js"></script>
  <script src="assets/chrome.js"></script>
  <script src="assets/auth-store.js"></script>
  <script src="assets/i18n.js"></script>
  <script>
    (function () {
      var role = new URLSearchParams(location.search).get('role') === 'company' ? 'company' : 'personal';
      var mode = 'login';
      var el = function (id) { return document.getElementById(id); };

      var COPY = {
        personal: {
          loginTitle: '다시 오셨네요',
          loginDesc: '개인 회원으로 로그인합니다',
          signupTitle: '개인 회원 가입',
          signupDesc: '경력을 적어 두면 맞는 공고만 골라 보여줍니다',
          nameLabel: '이름',
          extraLabel: '전문 분야 / 면허',
          demoId: 'drkim',
          demoName: '김건우',
          after: 'assessment.html'
        },
        company: {
          loginTitle: '기업 회원 로그인',
          loginDesc: '공고 등록과 지원자 확인을 이용합니다',
          signupTitle: '기업 회원 가입',
          signupDesc: '사업자 정보를 확인한 뒤 공고를 올릴 수 있습니다',
          nameLabel: '기업명',
          extraLabel: '사업자등록번호',
          demoId: 'snuh',
          demoName: '서울대학교병원',
          after: 'employer.html'
        }
      };

      function moveUnderline() {
        var target = mode === 'signup' ? el('tab-signup') : el('tab-login');
        var bar = el('tab-underline');
        bar.style.width = target.offsetWidth + 'px';
        bar.style.transform = 'translateX(' + target.offsetLeft + 'px)';
      }

      function paint() {
        var c = COPY[role];
        var signup = mode === 'signup';

        el('form-title').textContent = signup ? c.signupTitle : c.loginTitle;
        el('form-desc').textContent = signup ? c.signupDesc : c.loginDesc;
        el('cta-text').textContent = signup ? '가입하고 시작하기' : '로그인';
        el('label-name').textContent = c.nameLabel;
        el('label-extra').textContent = c.extraLabel;

        el('field-name').classList.toggle('hidden', !signup);
        el('field-extra').classList.toggle('hidden', !signup);
        el('field-confirm').classList.toggle('hidden', !signup);
        el('field-region').classList.toggle('hidden', !signup);
        el('label-region').textContent =
          role === 'company' ? '채용 지역' : '희망 근무 지역';

        el('tab-login').setAttribute('data-on', String(!signup));
        el('tab-signup').setAttribute('data-on', String(signup));
        el('switch-text').textContent = signup ? '이미 계정이 있으신가요?' : '계정이 없으신가요?';
        el('switch-link').textContent = signup ? '로그인' : '회원가입';

        document.querySelectorAll('.role').forEach(function (b) {
          b.setAttribute('data-on', String(b.getAttribute('data-role') === role));
        });

        moveUnderline();
      }

      function alertBox(kind, msg) {
        var box = el('alert');
        box.className =
          'mb-4 p-3.5 rounded-2xl text-[12.5px] leading-relaxed ' +
          (kind === 'error'
            ? 'bg-red-50 text-red-700 border border-red-100'
            : 'bg-emerald-50 text-emerald-700 border border-emerald-100');
        box.textContent = msg;
      }

      document.querySelectorAll('.role').forEach(function (b) {
        b.addEventListener('click', function () {
          var prev = COPY[role];
          role = b.getAttribute('data-role');
          // 앞선 역할의 예시 값을 그대로 두고 있었다면 새 역할 값으로 바꾼다
          if (el('userid').value.trim() === prev.demoId) el('userid').value = COPY[role].demoId;
          if (el('name').value.trim() === prev.demoName) el('name').value = COPY[role].demoName;
          paint();
        });
      });

      el('tab-login').addEventListener('click', function () { mode = 'login'; paint(); });
      el('tab-signup').addEventListener('click', function () { mode = 'signup'; paint(); });
      el('switch-link').addEventListener('click', function () {
        mode = mode === 'signup' ? 'login' : 'signup';
        paint();
      });
      el('fill-demo').addEventListener('click', function () {
        // 비밀번호는 '아이디 + 1234'로 통일한다
        var demoId = COPY[role].demoId;
        var demoPw = demoId + '1234';
        el('userid').value = demoId;
        el('name').value = COPY[role].demoName;
        el('password').value = demoPw;
        if (mode === 'signup') el('confirm').value = demoPw;
      });

      window.addEventListener('resize', moveUnderline);

      el('auth-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        var c = COPY[role];
        var userId = el('userid').value.trim();
        var password = el('password').value;
        var name = el('name').value.trim() || c.demoName;

        if (!userId) {
          alertBox('error', '아이디를 입력해 주세요.');
          return;
        }
        if (!/^[A-Za-z0-9._\-]{4,20}$/.test(userId)) {
          alertBox('error', '아이디는 영문, 숫자, . _ - 만 써서 4~20자로 지어 주세요.');
          return;
        }
        if (mode === 'signup') {
          if (!el('name').value.trim()) {
            alertBox('error', c.nameLabel + '을(를) 입력해 주세요.');
            return;
          }
          if (password !== el('confirm').value) {
            alertBox('error', '비밀번호가 서로 다릅니다.');
            return;
          }
        }

        var cta = el('cta');
        cta.setAttribute('data-busy', 'true');
        cta.setAttribute('disabled', 'true');

        try {
          var region = regionLabel();
          var profile =
            role === 'company'
              ? { userId: userId, name: name, bizNumber: el('extra').value.trim(), region: region }
              : { userId: userId, name: name, specialty: el('extra').value.trim(), region: region };

          // 채용공고 화면이 기본 필터로 읽는다
          if (mode === 'signup') {
            try {
              localStorage.setItem('chwireup-region', region);
            } catch (err) {}
          }

          var res =
            mode === 'signup'
              ? await window.ChwireupAccounts.signUp(role, userId, password, profile)
              : await window.ChwireupAccounts.signIn(role, userId, password, name);

          alertBox(
            'ok',
            name + '님으로 ' + (mode === 'signup' ? '가입했습니다.' : '로그인했습니다.') +
              (res.mode === 'demo' ? ' (데모 모드: 이 브라우저에만 저장됩니다)' : ' Firebase에 저장했습니다.')
          );

          var go = (res.role === 'company' ? 'employer.html' : role === 'company' ? 'employer.html' : c.after);
          setTimeout(function () { location.href = go; }, 750);
        } catch (err) {
          alertBox('error', window.ChwireupAccounts.message(err));

          // 계정이 없어서 막힌 경우라면 회원가입 화면으로 바로 넘겨준다
          if (mode === 'login' && window.ChwireupAccounts.isNoAccount(err)) {
            // Firebase 연결 전에 만든 계정은 이 브라우저에만 있다. 그 사실을 알려준다.
            var local = null;
            try {
              local = (JSON.parse(localStorage.getItem('chwireup-local-accounts') || '{}') || {})[
                userId.toLowerCase()
              ];
            } catch (e2) {}

            if (local) {
              alertBox(
                'error',
                '"' + userId + '"는 서버 연결 전에 만든 계정이라 이 브라우저에만 남아 있습니다. ' +
                  '같은 아이디로 다시 회원가입하면 정식 계정이 만들어집니다.'
              );
            }

            mode = 'signup';
            paint();
            el('name').focus();
          }

          cta.removeAttribute('data-busy');
          cta.removeAttribute('disabled');
        }
      });

      // 저장소 상태 표시
      var live = window.ChwireupAccounts.isFirebase();
      el('storage-text').textContent = live
        ? 'Firebase 계정으로 저장됩니다'
        : '데모 모드 · 이 브라우저에만 저장됩니다';

      // ── 지역 선택 ────────────────────────────────────────
      var REGIONS = {
        '전국': [],
        '서울': ['전체','종로구','중구','용산구','성동구','광진구','동대문구','중랑구','성북구','강북구','도봉구','노원구','은평구','서대문구','마포구','양천구','강서구','구로구','금천구','영등포구','동작구','관악구','서초구','강남구','송파구','강동구'],
        '부산': ['전체','중구','서구','동구','영도구','부산진구','동래구','남구','북구','해운대구','사하구','금정구','강서구','연제구','수영구','사상구','기장군'],
        '대구': ['전체','중구','동구','서구','남구','북구','수성구','달서구','달성군'],
        '인천': ['전체','중구','동구','미추홀구','연수구','남동구','부평구','계양구','서구','강화군','옹진군'],
        '광주': ['전체','동구','서구','남구','북구','광산구'],
        '대전': ['전체','동구','중구','서구','유성구','대덕구'],
        '울산': ['전체','중구','남구','동구','북구','울주군'],
        '세종': ['전체'],
        '경기': ['전체','수원시','성남시','고양시','용인시','부천시','안산시','안양시','남양주시','화성시','평택시','의정부시','시흥시','파주시','김포시','광명시','군포시','하남시','오산시','이천시','안성시','구리시','양주시','포천시','여주시','광주시'],
        '강원': ['전체','춘천시','원주시','강릉시','동해시','속초시','삼척시','태백시','홍천군','횡성군','영월군','평창군','정선군','철원군'],
        '충북': ['전체','청주시','충주시','제천시','보은군','옥천군','영동군','증평군','진천군','괴산군','음성군','단양군'],
        '충남': ['전체','천안시','공주시','보령시','아산시','서산시','논산시','계룡시','당진시','금산군','부여군','서천군','청양군','홍성군','예산군','태안군'],
        '전북': ['전체','전주시','군산시','익산시','정읍시','남원시','김제시','완주군','진안군','무주군','장수군','임실군','순창군','고창군','부안군'],
        '전남': ['전체','목포시','여수시','순천시','나주시','광양시','담양군','곡성군','구례군','고흥군','보성군','화순군','장흥군','강진군','해남군','영암군','무안군','함평군','영광군','장성군','완도군','진도군','신안군'],
        '경북': ['전체','포항시','경주시','김천시','안동시','구미시','영주시','영천시','상주시','문경시','경산시','의성군','청송군','영양군','영덕군','청도군','고령군','성주군','칠곡군','예천군','봉화군','울진군','울릉군'],
        '경남': ['전체','창원시','진주시','통영시','사천시','김해시','밀양시','거제시','양산시','의령군','함안군','창녕군','고성군','남해군','하동군','산청군','함양군','거창군','합천군'],
        '제주': ['전체','제주시','서귀포시']
      };

      var sidoSel = el('region-sido');
      var guSel = el('region-sigungu');

      Object.keys(REGIONS).forEach(function (name) {
        var o = document.createElement('option');
        o.value = name;
        o.textContent = name === '전국' ? '전국 (지역 무관)' : name;
        sidoSel.appendChild(o);
      });

      function fillSigungu() {
        var list = REGIONS[sidoSel.value] || [];
        guSel.innerHTML = '';
        guSel.disabled = list.length === 0;

        if (!list.length) {
          var none = document.createElement('option');
          none.value = '';
          none.textContent = '시·군·구 없음';
          guSel.appendChild(none);
          return;
        }
        list.forEach(function (name) {
          var o = document.createElement('option');
          o.value = name === '전체' ? '' : name;
          o.textContent = name === '전체' ? sidoSel.value + ' 전체' : name;
          guSel.appendChild(o);
        });
      }

      function regionLabel() {
        if (sidoSel.value === '전국') return '전국';
        return [sidoSel.value, guSel.value].filter(Boolean).join(' ');
      }

      sidoSel.addEventListener('change', fillSigungu);

      // 저장된 값 복원
      (function () {
        var saved = '';
        try {
          saved = localStorage.getItem('chwireup-region') || '';
        } catch (e) {}
        var parts = saved.split(' ');
        if (parts[0] && REGIONS[parts[0]]) {
          sidoSel.value = parts[0];
          fillSigungu();
          if (parts[1]) guSel.value = parts[1];
        } else {
          fillSigungu();
        }
      })();

      paint();
      // 웹폰트가 늦게 붙으면 탭 폭이 달라져 한 번 더 맞춘다
      setTimeout(moveUnderline, 300);
    })();
  </script>
</body>
</html>
