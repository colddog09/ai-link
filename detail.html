                  </div>
                </div>

                {/* Active Chat Box */}
                <div className="lg:col-span-8 bg-white rounded-2xl border border-gray-200 overflow-hidden flex flex-col h-full">
                  <div className="p-4 bg-gray-50 border-b flex justify-between items-center text-xs">
                    <div>
                      <h3 className="font-bold text-gray-900 text-sm">{selectedJob.companyName}</h3>
                      <p className="text-gray-500">담당: {selectedJob.recruiter.name} ({selectedJob.recruiter.title})</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="text-emerald-700 bg-emerald-50 px-2 py-1 rounded font-bold">0507 안심번호: {selectedJob.recruiter.safePhone}</span>
                    </div>
                  </div>

                  <div className="p-4 flex-1 overflow-y-auto space-y-3 bg-gray-50/30 text-xs">
                    {messages.filter(m => m.jobId === selectedJobId).map((msg) => (
                      <div key={msg.id} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                        <div className={`p-3 rounded-2xl max-w-[80%] ${msg.sender === 'user' ? 'bg-blue-700 text-white rounded-br-none' : 'bg-white border text-gray-900 rounded-bl-none shadow-xs'}`}>
                          {msg.text}
                        </div>
                        <span className="text-[10px] text-gray-400 mt-1">{msg.timestamp}</span>
                      </div>
                    ))}
                  </div>

                  {/* Input Form */}
                  <form onSubmit={(e) => { e.preventDefault(); const val = e.target.elements.chatInput.value; if (val.trim()) { handleSendMessage(val, selectedJobId); e.target.elements.chatInput.value = ''; } }} className="p-3 bg-white border-t flex gap-2">
                    <input
                      name="chatInput"
                      type="text"
                      placeholder="채용 담당자에게 문의사항을 입력하세요..."
                      className="flex-1 px-4 py-2 bg-gray-50 border rounded-xl text-xs focus:bg-white focus:outline-none"
                    />
                    <button type="submit" className="px-4 py-2 bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-1">
                      <Icon name="send" className="w-3.5 h-3.5" />
                      전송
                    </button>
                  </form>
                </div>
              </div>
            </main>
          )}

          {/* ========================================== */}
          {/* 5. TAB 4: 내 페이지 (저장 목록, 삭제, 지원) */}
          {/* ========================================== */}
          {currentTab === 'my-page' && (
            <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
              {/* Profile Card */}
              <div className="bg-white rounded-2xl border border-gray-200 p-6 shadow-xs flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div className="flex items-center gap-4">
                  <img src={userProfile.googleAvatar} alt="Profile" className="w-16 h-16 rounded-full border-2 border-blue-600 object-cover" />
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="text-xl font-bold text-gray-900">{userProfile.name} 원장</h1>
                      <span className="text-[11px] text-blue-700 bg-blue-50 border border-blue-200 px-2 py-0.5 rounded-full font-bold">
                        Google 1인 1계정 인증
                      </span>
                    </div>
                    <p className="text-xs text-gray-600 mt-0.5">{userProfile.specialty} ({userProfile.experienceYears}년) · 면허: {userProfile.licenseNumber}</p>
                    <p className="text-xs text-gray-400">{userProfile.email} · {userProfile.phone}</p>
                  </div>
                </div>
              </div>

              {/* Saved Items List with Delete (최신순 목록 & 삭제) */}
              <div className="space-y-4">
                <h3 className="text-sm font-bold text-gray-900">저장된 AI 분석 리포트 ({savedItemsList.length}건)</h3>
                <div className="space-y-2">
                  {savedItemsList.map((item) => (
                    <div key={item.id} className="bg-white p-4 rounded-xl border border-gray-200 flex justify-between items-center text-xs">
                      <div>
                        <h4 className="font-bold text-gray-900 text-sm">{item.title}</h4>
                        <p className="text-gray-600 mt-0.5">{item.subtitle}</p>
                        <span className="text-[10px] text-gray-400 mt-1 block">저장 일시: {item.savedAt}</span>
                      </div>
                      <button
                        onClick={() => handleDeleteSavedItem(item.id)}
                        className="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                        title="삭제"
                      >
                        <Icon name="trash" className="w-4 h-4" />
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              {/* Applications List */}
              <div className="space-y-4">
                <h3 className="text-sm font-bold text-gray-900">지원 현황 추적 ({applications.length}건)</h3>
                <div className="space-y-2">
                  {applications.map((app) => (
                    <div key={app.id} className="bg-white p-4 rounded-xl border border-gray-200 flex justify-between items-center text-xs">
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-gray-900 text-sm">{app.companyName} - {app.jobTitle}</span>
                          <span className="px-2 py-0.5 bg-blue-100 text-blue-800 font-bold rounded text-[10px]">{app.status}</span>
                        </div>
                        <span className="text-[10px] text-gray-400 mt-1 block">지원일: {app.appliedAt}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          )}

          {/* ========================================== */}
          {/* 6. MODALS                                  */}
          {/* ========================================== */}
          {/* Apply Modal */}
          {isApplyModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-gray-900">{selectedJob.companyName} 간편 지원</h3>
                  <button onClick={() => setIsApplyModalOpen(false)}><Icon name="x" className="w-5 h-5 text-gray-400" /></button>
                </div>
                <div className="space-y-3 text-xs">
                  <div className="p-3 bg-blue-50 rounded-xl text-blue-950 font-medium">
                    {userProfile.name} 원장님의 15년 전문의 이력 및 AI 매칭 리포트가 함께 전달됩니다.
                  </div>
                  <textarea
                    id="coverNoteInput"
                    placeholder="채용 담당자에게 전달할 메모 또는 문의사항을 입력하세요."
                    rows="3"
                    className="w-full p-3 border rounded-xl text-xs bg-gray-50 focus:bg-white"
                  ></textarea>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setIsApplyModalOpen(false)} className="px-4 py-2 border rounded-lg text-xs font-semibold">취소</button>
                  <button
                    onClick={() => {
                      const note = document.getElementById('coverNoteInput')?.value || '';
                      handleConfirmApply(note);
                    }}
                    className="px-5 py-2 bg-blue-700 text-white rounded-lg text-xs font-bold"
                  >
                    지원서 제출
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Contact Modal */}
          {isContactModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-gray-900">0507 안심 소통 및 문의</h3>
                  <button onClick={() => setIsContactModalOpen(false)}><Icon name="x" className="w-5 h-5 text-gray-400" /></button>
                </div>
                <div className="space-y-3 text-xs">
                  <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-950">
                    <p className="font-bold">가상 안심번호: {selectedJob.recruiter.safePhone}</p>
                    <p className="text-[11px] text-emerald-800 mt-1">개인 휴대폰 노출 없이 다이렉트 통화가 중계됩니다.</p>
                  </div>
                  <button
                    onClick={() => { setIsContactModalOpen(false); setCurrentTab('communication'); }}
                    className="w-full py-2.5 bg-blue-700 text-white rounded-xl font-bold"
                  >
                    1:1 실시간 채팅 열기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Terms Modal */}
          {isTermsModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xl w-full p-6 space-y-4">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-bold text-base text-gray-900">이용약관 및 개인정보 보호 규정</h3>
                  <button onClick={() => setIsTermsModalOpen(false)}><Icon name="x" className="w-5 h-5 text-gray-400" /></button>
                </div>
                <div className="space-y-3 text-xs text-gray-700 leading-relaxed max-h-80 overflow-y-auto">
                  <p><strong>1. 1인 1계정 원칙:</strong> 취R업은 Google 본인 인증을 통한 1인 1계정만을 지원하며, 타인의 면허 도용을 엄격히 금지합니다.</p>
                  <p><strong>2. 불법 구인 정보 차단:</strong> 근로기준법 및 직업안정법에 위배되는 허위·과장 채용 공고는 전담 검수팀 및 AI 필터링에 의해 즉각 영구 차단됩니다.</p>
                  <p><strong>3. 0507 안심번호 보호:</strong> 구직자의 개인 연락처는 기업에 직접 노출되지 않고 가상 안심번호로 암호화 처리됩니다.</p>
                </div>
                <div className="flex justify-end pt-2">
                  <button onClick={() => setIsTermsModalOpen(false)} className="px-5 py-2 bg-[#0f3b82] text-white rounded-lg font-bold text-xs">확인</button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================== */}
          {/* 7. GLOBAL FOOTER                           */}
        </div>
      );
    }

    // Mount to DOM
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>

  <div id="app-footer"></div>
  <script src="assets/chrome.js"></script>
  <script src="assets/auth-store.js"></script>
  <script src="assets/i18n.js"></script>
</body>
</html>
